name: Build HyperOS 4 Port (rhode)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-super:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar espacio en /mnt/work e instalar herramientas
        run: |
          sudo mkdir -p /mnt/work/{downloads,raw,extracted,images,out}
          sudo chown -R $USER:$USER /mnt/work
          df -h /mnt/work

          sudo apt-get update
          sudo apt-get install -y zstd erofs-utils e2fsprogs android-sdk-libsparse-utils p7zip-full python3 libxml2-utils git clang lld build-essential zlib1g-dev libssl-dev

          if ! command -v lpmake &> /dev/null; then
            echo "Clonando y compilando lpmake..."
            git clone --depth=1 https://github.com/LonelyFool/lpunpack_and_lpmake.git /tmp/lptools_src
            cd /tmp/lptools_src
            find . -name "utility.cpp" -exec sed -i '1i #include <algorithm>' {} +
            chmod +x make.sh
            ./make.sh
            sudo install -m 0755 bin/lpmake /usr/local/bin/lpmake
          fi

          which lpmake
          lpmake --help | head -n 5

      - name: Descargar Releases (base-rhode-vendor, donor-hyperos4-base, patched-jars)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-rhode-vendor -R ${{ github.repository }} -p "vendor_rhode_base.img.zst" -D /mnt/work/downloads
          gh release download patched-jars -R ${{ github.repository }} -p "services.jar" -D /mnt/work/downloads
          gh release download donor-hyperos4-base -R ${{ github.repository }} -p "system.img.zst" -D /mnt/work/downloads
          gh release download donor-hyperos4-base -R ${{ github.repository }} -p "system_ext.img.zst" -D /mnt/work/downloads
          gh release download donor-hyperos4-base -R ${{ github.repository }} -p "mi_ext.img.zst" -D /mnt/work/downloads
          gh release download donor-hyperos4-base -R ${{ github.repository }} -p "product.img.zst.part_*" -D /mnt/work/downloads
          ls -lh /mnt/work/downloads

      - name: Unir y descomprimir imágenes base en /mnt/work/raw
        run: |
          cd /mnt/work/downloads
          cat product.img.zst.part_* > product.img.zst
          rm -f product.img.zst.part_*

          for img in vendor_rhode_base system system_ext mi_ext product; do
            echo "Descomprimiendo ${img}.img.zst..."
            zstd -d "${img}.img.zst" -o "/mnt/work/raw/${img}.img"
            rm -f "${img}.img.zst"
          done

          for f in /mnt/work/raw/*.img; do
            if file "$f" | grep -q "Android sparse image"; then
              echo "Convirtiendo sparse a raw: $f"
              simg2img "$f" "${f}.raw" && mv "${f}.raw" "$f"
            fi
          done
          ls -lh /mnt/work/raw
          df -h /mnt/work

      - name: Extraer particiones donantes (soporte automático EROFS y EXT4)
        run: |
          extract_img() {
            local IMG_PATH="$1"
            local OUT_DIR="$2"
            mkdir -p "$OUT_DIR"
            if blkid "$IMG_PATH" \vert{} grep -qi "erofs" \vert{}\vert{} file "$IMG_PATH" | grep -qi "EROFS"; then
              echo "Extrayendo EROFS: $IMG_PATH ->$OUT_DIR"
              sudo fsck.erofs --extract="$OUT_DIR" "$IMG_PATH"
            else
              echo "Montando y copiando EXT4: $IMG_PATH ->$OUT_DIR"
              mkdir -p /mnt/work/tmp_mnt
              sudo mount -o ro,loop "$IMG_PATH" /mnt/work/tmp_mnt
              sudo cp -a /mnt/work/tmp_mnt/. "$OUT_DIR/"
              sudo umount /mnt/work/tmp_mnt
            fi
          }

          extract_img /mnt/work/raw/system.img /mnt/work/extracted/system
          extract_img /mnt/work/raw/system_ext.img /mnt/work/extracted/system_ext
          extract_img /mnt/work/raw/product.img /mnt/work/extracted/product
          extract_img /mnt/work/raw/mi_ext.img /mnt/work/extracted/mi_ext

          rm -f /mnt/work/raw/system.img /mnt/work/raw/system_ext.img /mnt/work/raw/product.img /mnt/work/raw/mi_ext.img
          df -h /mnt/work

      - name: Inyectar services.jar, fusionar mi_ext, purga final CN y props de rhode
        run: |
          # 1. Inyectar services.jar parcheado (Sesión 3)
          SYS_ROOT="/mnt/work/extracted/system"
          SYS_DIR="$SYS_ROOT/system"
          [ ! -d "$SYS_DIR" ] && SYS_DIR="$SYS_ROOT"

          sudo cp -f /mnt/work/downloads/services.jar "$SYS_DIR/framework/services.jar"
          sudo chmod 0644 "$SYS_DIR/framework/services.jar"
          sudo chown root:root "$SYS_DIR/framework/services.jar"
          sudo rm -rf "$SYS_DIR/framework/oat/arm64/services."* "$SYS_DIR/framework/oat/arm/services."* || true

          # 2. Fusionar mi_ext en product preservando permisos y concatenando su build.prop
          echo "Fusionando mi_ext en product..."
          if [ -f "/mnt/work/extracted/mi_ext/etc/build.prop" ] && [ -f "/mnt/work/extracted/product/etc/build.prop" ]; then
            echo "" | sudo tee -a /mnt/work/extracted/product/etc/build.prop > /dev/null
            echo "# Merged from mi_ext" | sudo tee -a /mnt/work/extracted/product/etc/build.prop > /dev/null
            sudo cat /mnt/work/extracted/mi_ext/etc/build.prop | sudo tee -a /mnt/work/extracted/product/etc/build.prop > /dev/null
          fi
          sudo cp -rnp /mnt/work/extracted/mi_ext/* /mnt/work/extracted/product/ || true
          sudo rm -rf /mnt/work/extracted/mi_ext

          # Crear symlink /mi_ext -> /product en la raíz de system
          sudo rm -rf "$SYS_ROOT/mi_ext"
          sudo ln -sf /product "$SYS_ROOT/mi_ext"

          # 3. PURGA PROFUNDA CN + RECORTE FINAL
          PROD_DIR="/mnt/work/extracted/product"
          SYSEXT_DIR="/mnt/work/extracted/system_ext"

          # 3a. Eliminar todos los precompilados oat en apps
          sudo find "$PROD_DIR/app" "$PROD_DIR/priv-app" -type d -name "oat" -exec rm -rf {} + 2>/dev/null || true
          sudo find "$SYS_DIR/app" "$SYS_DIR/priv-app" -type d -name "oat" -exec rm -rf {} + 2>/dev/null || true
          sudo find "$SYSEXT_DIR/app" "$SYSEXT_DIR/priv-app" -type d -name "oat" -exec rm -rf {} + 2>/dev/null || true

          # 3b. Eliminar carpetas ocultas de preinstalación CN y operadoras
          sudo rm -rf "$PROD_DIR/data-app" "$PROD_DIR/usr/srec" "$PROD_DIR/pangu" "$PROD_DIR/cust" "$PROD_DIR/region" "$PROD_DIR/opcust" 2>/dev/null || true
          sudo rm -rf "$SYSEXT_DIR/data-app" "$SYS_DIR/data-app" 2>/dev/null || true

          # 3c. Podar multimedia, superwallpapers, temas, bootanimation pesado y fuentes CJK extra
          sudo rm -rf "$PROD_DIR/media/theme" "$PROD_DIR/media/wallpaper" "$PROD_DIR/media/audio/alarms" "$PROD_DIR/media/audio/ringtones" "$PROD_DIR/media/audio/notifications" "$PROD_DIR/media/bootanimation.zip" 2>/dev/null || true
          sudo rm -rf "$PROD_DIR/fonts/Miui*Chinese*" "$PROD_DIR/fonts/NotoSansSC*" "$SYS_DIR/fonts/NotoSansCJK*" 2>/dev/null || true
          sudo rm -rf "$PROD_DIR/overlay/"* 2>/dev/null || true

          # 3d. Lista ampliada de apps CN / IA / SuperWallpapers / servicios secundarios
          BLOAT_APPS=(
            "MiBrowser" "MiBrowserGlobal" "MIUIBrowser"
            "MiVideo" "MIUIVideo" "MiMusic" "MIUIMusic"
            "Health" "MIUIHealth" "GameCenter" "MIUIGameCenter"
            "Midrop" "AnalyticsCore" "MSA" "MSA-Global"
            "YellowPage" "MIUIYellowPage" "GlobalFashionStore"
            "PartnerBookmarksProvider" "GoogleOne" "YouTube"
            "YouTubeMusic" "Music2" "Duo" "Meet" "Maps"
            "Photos" "Gmail2" "Chrome" "Velvet" "GoogleTTS"
            "Drive" "Docs" "Sheets" "Slides" "CalendarGoogle"
            "Videos" "PlayGames" "AndroidAutoStub" "Recorder"
            "MiRadio" "FM" "MiBugReport" "MIUIBugReport"
            "HybridAccessory" "HybridPlatform" "Joyose"
            "PaymentService" "Mipay" "NextPay" "XMSFKeeper"
            "CIT" "XiaomiAccount" "AppStore" "Fengmi" "Duokan"
            "MiConnectService" "MiShop" "Milab" "MiCredit"
            "YouDaoEngine" "SogouInput" "BaiduIME" "PersonalAssistant"
            "SoterServiceProvider" "UserGuide" "WpsLite" "BuiltInPrintService"
            "Gallery" "MiuiGallery" "Weather" "MiuiWeather" "Calculator"
            "Clock" "Notes" "MiuiNotes" "Scanner" "Compass" "ScreenRecorder"
            "VoiceRecorder" "Screencast" "FileExplorer" "Updater" "SystemUpdater"
            "XiaomiCloud" "MiCloudClient" "AuthService" "Stk"
            "MiuiDaemon" "MiuiContentExtension" "VoiceAssist" "XiaoAiSpeechEngine"
            "MiLinkService" "MiShare" "NewHome" "MIUINewHome" "ThirdAppAssistant"
            "MiuiFrequentPhrase" "TouchAssistant" "CleanMaster" "MIUICleanMaster"
            "AIAsstVision" "MiuiAod" "MIUISuperWallpaper" "SuperWallpaper"
            "MIUISuperWallpaperEarth" "MIUISuperWallpaperMars" "MIUISuperWallpaperSaturn"
            "MIUISuperWallpaperSnowMountain" "MIUISuperWallpaperGeometry"
            "MiuiFreeformService" "Taplus" "MiGameCenterSDKService"
            "MiMover" "CloudBackup" "Backup" "MiuiBackup" "QuickSearchBox"
            "MIUIQuickSearchBox" "MiuiScanner" "TranslationService" "AiEngine"
            "CarWith" "ICar" "MiAuto" "SmartHome" "MiHome"
          )
          for
