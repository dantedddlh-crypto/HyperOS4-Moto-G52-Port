name: "Compilar Kernel 4.19.325 (rhode) con BPF Uname Spoof"

on:
  workflow_dispatch:
    inputs:
      spoofed_release:
        description: "Versión uname reportada a bpfloader (ej. 5.15.148-android13-8-g000000000000)"
        required: true
        default: "5.15.148-android13-8-g000000000000"
        type: string
      evox_boot_url:
        description: "URL del boot_evox.img.zst original de Evolution X (en tu Release evox-extracted)"
        required: true
        default: "https://github.com/dantedddlh-crypto/HyperOS4-Moto-G52-Port/releases/download/evox-extracted/boot_evox.img.zst"
        type: string

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Preparar /mnt/work, dependencias y magiskboot
        run: |
          sudo mkdir -p /mnt/work/tools /mnt/work/toolchain /mnt/work/kernel
          sudo chown -R $USER:$USER /mnt/work
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libelf-dev python3 python-is-python3 wget xz-utils zip zstd cpio p7zip-full

          curl -fL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o /mnt/work/magisk.apk
          unzip -p /mnt/work/magisk.apk lib/x86_64/libmagiskboot.so > /mnt/work/tools/magiskboot
          chmod +x /mnt/work/tools/magiskboot
          rm -f /mnt/work/magisk.apk

      - name: Descargar AOSP Clang r596125 y clonar android_kernel_motorola_sm6225 (lineage-23.2)
        run: |
          mkdir -p /mnt/work/toolchain/clang-r596125

          # Descarga rápida vía CDN de GitHub (tarda ~10 segundos)
          CLANG_URLS=(
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r596125/archive/refs/heads/lineage-23.2.tar.gz"
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r596125/archive/refs/heads/lineage-23.1.tar.gz"
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r584948/archive/refs/heads/lineage-23.2.tar.gz"
          )

          DOWNLOADED=0
          for url in "${CLANG_URLS[@]}"; do
            echo "Probando mirror: $url"
            if curl -fL --connect-timeout 15 "$url" -o /mnt/work/clang.tar.gz; then
              tar -xzf /mnt/work/clang.tar.gz --strip-components=1 -C /mnt/work/toolchain/clang-r596125
              rm -f /mnt/work/clang.tar.gz
              DOWNLOADED=1
              break
            fi
          done

          [ "$DOWNLOADED" -eq 1 ] || { echo "Error: No se pudo descargar AOSP Clang"; exit 1; }
          /mnt/work/toolchain/clang-r596125/bin/clang --version

          # Clonar el árbol del kernel de rhode (4.19.325-cip136-st20)
          git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_motorola_sm6225.git /mnt/work/kernel

      - name: Aplicar parche spoof uname release para bpfloader (commit 1cfc951) en kernel/sys.c
        run: |
          cd /mnt/work/kernel
          python3 - << 'EOF'
          with open("kernel/sys.c", "r") as f:
              content = f.read()

          target = "if (copy_to_user(name, &tmp, sizeof(tmp)))"
          spoof_val = "${{ github.event.inputs.spoofed_release }}"
          patch = f'\tstrscpy(tmp.release, "{spoof_val}", sizeof(tmp.release));\n\t{target}'

          assert target in content, "No se encontró copy_to_user en SYSCALL_DEFINE1(newuname)"
          content = content.replace(target, patch, 1)

          with open("kernel/sys.c", "w") as f:
              f.write(content)
          EOF
          echo "=== Diff aplicado en kernel/sys.c ==="
          git diff kernel/sys.c

      - name: Configurar y compilar kernel (rhode) con AOSP Clang r596125
        run: |
          cd /mnt/work/kernel
          export PATH="/mnt/work/toolchain/clang-r596125/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== Defconfigs disponibles en arch/arm64/configs/vendor ==="
          find arch/arm64/configs -type f | sort

          # Ensamblar configuración real de Motorola SM6225 (rhode)
          BASE_DEFCONFIG="vendor/bengal-perf_defconfig"
          [ ! -f "arch/arm64/configs/$BASE_DEFCONFIG" ] && BASE_DEFCONFIG="vendor/sm6225-perf_defconfig"

          FRAGMENTS=""
          for frag in \
            "arch/arm64/configs/vendor/ext_config/moto-bengal.config" \
            "arch/arm64/configs/vendor/ext_config/rhode-default.config" \
            "arch/arm64/configs/vendor/rhode.config"; do
            [ -f "$frag" ] && FRAGMENTS="$FRAGMENTS $frag"
          done

          echo "Base elegida: $BASE_DEFCONFIG"
          echo "Fragmentos aplicados: $FRAGMENTS"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 $BASE_DEFCONFIG
          if [ -n "$FRAGMENTS" ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENTS
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          fi

          # Compilar Image.gz-dtb y DTBs con los mismos flags de AOSP Clang r596125
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs

          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Reempaquetar boot_hyperos_bpf.img con el ramdisk de Evolution X
        run: |
          set -euo pipefail
          mkdir -p /mnt/work/boot_repack /mnt/work/out_release
          cd /mnt/work/boot_repack

          DOWNLOADED=""
          for URL in \
            "${{ github.event.inputs.evox_boot_url }}" \
            "https://github.com/dantedddlh-crypto/HyperOS4-Moto-G52-Port/releases/download/evox-extracted/boot_evox.img.zst" \
            "https://github.com/dantedddlh-crypto/HyperOS4-Moto-G52-Port/releases/download/evox-source/boot_evox.img.zst"; do
            if curl -fL --retry 3 "$URL" -o boot_download 2>/dev/null; then
              DOWNLOADED="$URL"
              break
            fi
          done
          [ -n "$DOWNLOADED" ] || { echo "No se pudo descargar ninguna imagen boot válida de Evolution X"; exit 1; }
          echo "Imagen base descargada: $DOWNLOADED"

          if file boot_download | grep -qi "Zstandard"; then
            zstd -d -f boot_download -o boot_orig.img
          else
            cp -f boot_download boot_orig.img
          fi

          file boot_orig.img
          ls -lh boot_orig.img

          rm -rf boot_repack_work
          mkdir boot_repack_work
          cd boot_repack_work

          /mnt/work/tools/magiskboot unpack ../boot_orig.img
          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb kernel

          /mnt/work/tools/magiskboot repack ../boot_orig.img /mnt/work/out_release/boot_hyperos_bpf.img

          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb /mnt/work/out_release/Image.gz-dtb

          ls -lh /mnt/work/out_release/

      - name: Publicar boot_hyperos_bpf.img en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-rhode-bpf-spoof
          name: "Kernel 4.19.325 (rhode) - BPF Uname Spoof (5.15.148)"
          files: |
            /mnt/work/out_release/boot_hyperos_bpf.img
            /mnt/work/out_release/Image.gz-dtb
