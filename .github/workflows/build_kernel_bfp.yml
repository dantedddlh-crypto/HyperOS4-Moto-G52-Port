name: "Compilar Kernel 4.19.325 (rhode) con BPF Uname Spoof"

on:
  workflow_dispatch:
    inputs:
      spoofed_release:
        description: "Versión uname reportada a bpfloader (ej. 5.15.148-android13-8-g000000000000)"
        required: true
        default: "5.15.148-android13-8-g000000000000"
        type: string

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Preparar /mnt/work, dependencias y magiskboot
        run: |
          sudo mkdir -p /mnt/work/tools /mnt/work/toolchain /mnt/work/kernel
          sudo chown -R $USER:$USER /mnt/work
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libelf-dev python3 python-is-python3 wget xz-utils zip zstd cpio p7zip-full

          curl -fL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o /mnt/work/magisk.apk
          unzip -p /mnt/work/magisk.apk lib/x86_64/libmagiskboot.so > /mnt/work/tools/magiskboot
          chmod +x /mnt/work/tools/magiskboot
          rm -f /mnt/work/magisk.apk

      - name: Descargar AOSP Clang 22 y clonar android_kernel_motorola_sm6225 (lineage-23.2)
        run: |
          mkdir -p /mnt/work/toolchain/clang-r596125

          # Obtener automáticamente el último release de Clang 22 (o el más reciente disponible) desde GitHub CDN
          CLANG_URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases?per_page=10" \
            | grep -oE '"browser_download_url":\s*"[^"]+Clang-22[^"]*\.tar\.gz"' \
            | head -n 1 | cut -d'"' -f4)

          # Fallback al último release general de ZyCromerZ/Clang si aún no hay tag Clang-22
          if [ -z "$CLANG_URL" ]; then
            CLANG_URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases/latest" \
              | grep -oE '"browser_download_url":\s*"[^"]+\.tar\.gz"' \
              | head -n 1 | cut -d'"' -f4)
          fi

          echo "Descargando toolchain desde: $CLANG_URL"
          curl -fL "$CLANG_URL" -o /mnt/work/clang.tar.gz
          tar -xzf /mnt/work/clang.tar.gz -C /mnt/work/toolchain/clang-r596125
          rm -f /mnt/work/clang.tar.gz

          # Si el tar extrajo una subcarpeta raíz, mover su contenido a clang-r596125
          if [ ! -f /mnt/work/toolchain/clang-r596125/bin/clang ]; then
            SUBDIR=$(find /mnt/work/toolchain/clang-r596125 -maxdepth 2 -type f -name "clang" | head -n 1 | xargs dirname | xargs dirname)
            mv "$SUBDIR"/* /mnt/work/toolchain/clang-r596125/
          fi

          /mnt/work/toolchain/clang-r596125/bin/clang --version

          # Clonar el árbol del kernel de rhode (4.19.325-cip136-st20)
          git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_motorola_sm6225.git /mnt/work/kernel

      - name: Aplicar parche spoof uname release para bpfloader (commit 1cfc951) en kernel/sys.c
        run: |
          cd /mnt/work/kernel
          python3 - << 'EOF'
          with open("kernel/sys.c", "r") as f:
              content = f.read()

          target = "if (copy_to_user(name, &tmp, sizeof(tmp)))"
          spoof_val = "${{ github.event.inputs.spoofed_release }}"
          patch = f'\tstrscpy(tmp.release, "{spoof_val}", sizeof(tmp.release));\n\t{target}'

          assert target in content, "No se encontró copy_to_user en SYSCALL_DEFINE1(newuname)"
          content = content.replace(target, patch, 1)

          with open("kernel/sys.c", "w") as f:
              f.write(content)
          EOF
          echo "=== Diff aplicado en kernel/sys.c ==="
          git diff kernel/sys.c

      - name: Configurar y compilar kernel (rhode) con Clang 22
        run: |
          cd /mnt/work/kernel
          export PATH="/mnt/work/toolchain/clang-r596125/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          BASE_DEFCONFIG="vendor/bengal-perf_defconfig"
          [ ! -f "arch/arm64/configs/$BASE_DEFCONFIG" ] && BASE_DEFCONFIG="vendor/sm6225-perf_defconfig"

          FRAGMENTS=""
          for frag in \
            "arch/arm64/configs/vendor/ext_config/moto-bengal.config" \
            "arch/arm64/configs/vendor/ext_config/rhode-default.config" \
            "arch/arm64/configs/vendor/rhode.config"; do
            [ -f "$frag" ] && FRAGMENTS="$FRAGMENTS $frag"
          done

          echo "Base elegida: $BASE_DEFCONFIG"
          echo "Fragmentos aplicados: $FRAGMENTS"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 $BASE_DEFCONFIG
          if [ -n "$FRAGMENTS" ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENTS
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          fi

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs

          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Reempaquetar boot_hyperos_bpf.img y generar ZIP AnyKernel3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /mnt/work/boot_repack /mnt/work/out_release
          cd /mnt/work/boot_repack

          echo "=== Descargando boot_evox desde Release evox-extracted ==="
          gh release download evox-extracted --pattern "*boot*" --dir /mnt/work/boot_repack || true
          ls -lh /mnt/work/boot_repack

          if ls /mnt/work/boot_repack/*boot*.img.zst >/dev/null 2>&1; then
            ZST_FILE=$(ls /mnt/work/boot_repack/*boot*.img.zst | head -n 1)
            zstd -d "$ZST_FILE" -o boot_orig.img
          elif ls /mnt/work/boot_repack/*boot*.img >/dev/null 2>&1; then
            IMG_FILE=$(ls /mnt/work/boot_repack/*boot*.img | head -n 1)
            cp -f "$IMG_FILE" boot_orig.img
          fi

          if [ -f boot_orig.img ]; then
            /mnt/work/tools/magiskboot unpack boot_orig.img
            cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb kernel
            /mnt/work/tools/magiskboot repack boot_orig.img /mnt/work/out_release/boot_hyperos_bpf.img
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /mnt/work/AnyKernel3
          cd /mnt/work/AnyKernel3
          rm -rf .git README.md
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=rhode/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=moto_g52/g' anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=auto;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' anykernel.sh

          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 /mnt/work/out_release/AnyKernel3-rhode-4.19.325-bpf-spoof.zip ./*

          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb /mnt/work/out_release/Image.gz-dtb
          ls -lh /mnt/work/out_release/

      - name: Publicar kernel y boot_hyperos_bpf.img en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-rhode-bpf-spoof
          name: "Kernel 4.19.325 (rhode) - BPF Uname Spoof (5.15.148)"
          files: |
            /mnt/work/out_release/*
