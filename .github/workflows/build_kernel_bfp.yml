name: "Compilar Kernel 4.19.325 (rhode) con BPF Uname Spoof y Módulos"

on:
  workflow_dispatch:
    inputs:
      spoofed_release:
        description: "Versión uname reportada a bpfloader (ej. 5.15.148-android13-8-g000000000000)"
        required: true
        default: "5.15.148-android13-8-g000000000000"
        type: string

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Preparar /mnt/work, dependencias y magiskboot
        run: |
          sudo mkdir -p /mnt/work/tools /mnt/work/toolchain /mnt/work/kernel
          sudo chown -R $USER:$USER /mnt/work
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git kmod libncurses5-dev libssl-dev libelf-dev libxml2 libxml2-dev python3 python-is-python3 wget xz-utils zip zstd cpio p7zip-full

          curl -fL "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" -o /mnt/work/magisk.apk
          unzip -p /mnt/work/magisk.apk lib/x86_64/libmagiskboot.so > /mnt/work/tools/magiskboot
          chmod +x /mnt/work/tools/magiskboot
          rm -f /mnt/work/magisk.apk

      - name: Descargar Clang 22 y clonar android_kernel_motorola_sm6225 (lineage-23.2)
        run: |
          mkdir -p /mnt/work/toolchain/clang-r596125

          CLANG_URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases?per_page=10" \
            | grep -oE '"browser_download_url":\s*"[^"]+Clang-22[^"]*\.tar\.gz"' \
            | head -n 1 | cut -d'"' -f4)

          if [ -z "$CLANG_URL" ]; then
            CLANG_URL=$(curl -s "https://api.github.com/repos/ZyCromerZ/Clang/releases/latest" \
              | grep -oE '"browser_download_url":\s*"[^"]+\.tar\.gz"' \
              | head -n 1 | cut -d'"' -f4)
          fi

          echo "Descargando toolchain desde: $CLANG_URL"
          curl -fL "$CLANG_URL" -o /mnt/work/clang.tar.gz
          tar -xzf /mnt/work/clang.tar.gz -C /mnt/work/toolchain/clang-r596125
          rm -f /mnt/work/clang.tar.gz

          if [ ! -f /mnt/work/toolchain/clang-r596125/bin/clang ]; then
            SUBDIR=$(find /mnt/work/toolchain/clang-r596125 -maxdepth 2 -type f -name "clang" | head -n 1 | xargs dirname | xargs dirname)
            mv "$SUBDIR"/* /mnt/work/toolchain/clang-r596125/
          fi

          /mnt/work/toolchain/clang-r596125/bin/clang --version
          /mnt/work/toolchain/clang-r596125/bin/ld.lld --version

          git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_motorola_sm6225.git /mnt/work/kernel

      - name: Aplicar parche spoof uname release para bpfloader (commit 1cfc951) en kernel/sys.c
        run: |
          cd /mnt/work/kernel
          python3 - << 'EOF'
          with open("kernel/sys.c", "r") as f:
              content = f.read()

          target = "if (copy_to_user(name, &tmp, sizeof(tmp)))"
          spoof_val = "${{ github.event.inputs.spoofed_release }}"
          patch = f'\tstrscpy(tmp.release, "{spoof_val}", sizeof(tmp.release));\n\t{target}'

          assert target in content, "No se encontró copy_to_user en SYSCALL_DEFINE1(newuname)"
          content = content.replace(target, patch, 1)

          with open("kernel/sys.c", "w") as f:
              f.write(content)
          EOF
          echo "=== Diff aplicado en kernel/sys.c ==="
          git diff kernel/sys.c

      - name: Configurar y compilar kernel + módulos .ko (rhode) con Clang 22
        run: |
          cd /mnt/work/kernel
          export PATH="/mnt/work/toolchain/clang-r596125/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          BASE_DEFCONFIG="vendor/bengal-perf_defconfig"
          [ ! -f "arch/arm64/configs/$BASE_DEFCONFIG" ] && BASE_DEFCONFIG="vendor/sm6225-perf_defconfig"

          mkdir -p arch/arm64/configs/vendor
          cat > arch/arm64/configs/vendor/hyperos_port.config <<'EOF'
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_SECURITY=y
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          EOF

          FRAGMENTS=""
          for frag in \
            "arch/arm64/configs/vendor/ext_config/moto-bengal.config" \
            "arch/arm64/configs/vendor/ext_config/rhode-default.config" \
            "arch/arm64/configs/vendor/rhode.config"; do
            [ -f "$frag" ] && FRAGMENTS="$FRAGMENTS $frag"
          done
          FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/hyperos_port.config"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 $BASE_DEFCONFIG
          if [ -n "$FRAGMENTS" ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config $FRAGMENTS
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
            grep -E "CONFIG_(EXT4_FS|EXT4_FS_SECURITY|EROFS_FS|BPF_SYSCALL|CGROUP_BPF)=" out/.config || true
            for config in EXT4_FS EXT4_FS_SECURITY EROFS_FS EROFS_FS_ZIP BPF_SYSCALL CGROUP_BPF BPF_JIT IKCONFIG IKCONFIG_PROC; do
              value=$(sed -n "s/^CONFIG_${config}=//p" out/.config)
              [ -n "$value" ] || value="n"
              echo "CONFIG_${config}=${value}"
              [ "$value" = "y" ] || { echo "::error::CONFIG_${config} no quedó habilitado tras olddefconfig"; exit 1; }
            done
          fi

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbs modules

          KERNEL_RELEASE=$(cat out/include/config/kernel.release)
          MODINFO_KO=$(find out -type f -name "*.ko" -print -quit)
          [ -n "$MODINFO_KO" ] || { echo "::error::No se encontraron módulos .ko compilados"; exit 1; }
          VERMAGIC=$(modinfo -F vermagic "$MODINFO_KO")
          echo "kernel.release: $KERNEL_RELEASE"
          echo "vermagic ($MODINFO_KO): $VERMAGIC"

          mkdir -p /mnt/work/mod_out /mnt/work/out_release
          make O=out ARCH=arm64 LLVM=1 INSTALL_MOD_PATH=/mnt/work/mod_out INSTALL_MOD_STRIP=1 modules_install
          MODULES_DIR="/mnt/work/mod_out/lib/modules/$KERNEL_RELEASE"
          test -d "$MODULES_DIR" || { echo "::error::No existe el directorio instalado de módulos: $MODULES_DIR"; exit 1; }
          depmod -b /mnt/work/mod_out "$KERNEL_RELEASE"
          for metadata in modules.dep modules.alias modules.softdep; do
            test -f "$MODULES_DIR/$metadata" || { echo "::error::depmod no generó $metadata"; exit 1; }
          done
          find "$MODULES_DIR" -type f -name "*.ko" -print
          tar -czf /mnt/work/out_release/rhode-kernel-modules.tar.gz -C "$MODULES_DIR" .

          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Reempaquetar boot_hyperos_bpf.img y generar ZIP AnyKernel3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /mnt/work/boot_repack
          cd /mnt/work/boot_repack

          gh release download evox-extracted --repo "${{ github.repository }}" --pattern "*boot_evox*" --dir /mnt/work/boot_repack || \
          gh release download evox-extracted --repo "${{ github.repository }}" --pattern "*boot*" --dir /mnt/work/boot_repack || true
          ls -lh /mnt/work/boot_repack

          if ls /mnt/work/boot_repack/*boot*.img.zst >/dev/null 2>&1; then
            ZST_FILE=$(ls /mnt/work/boot_repack/*boot*.img.zst | head -n 1)
            zstd -d "$ZST_FILE" -o boot_orig.img
          elif ls /mnt/work/boot_repack/*boot*.img >/dev/null 2>&1; then
            IMG_FILE=$(ls /mnt/work/boot_repack/*boot*.img | head -n 1)
            cp -f "$IMG_FILE" boot_orig.img
          fi

          test -s boot_orig.img || { echo "::error::No se pudo descomprimir una imagen boot válida a boot_orig.img"; exit 1; }
          /mnt/work/tools/magiskboot unpack -h boot_orig.img
          python3 - <<'PY'
          from pathlib import Path

          header = Path("header")
          lines = header.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith("cmdline="):
                  tokens = line.partition("=")[2].split()
                  tokens = [token for token in tokens if not token.startswith("androidboot.selinux=")]
                  tokens.append("androidboot.selinux=permissive")
                  lines[index] = "cmdline=" + " ".join(tokens)
                  break
          else:
              raise SystemExit("::error::magiskboot no incluyó cmdline en el header")

          header.write_text("\n".join(lines) + "\n")
          PY
          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb kernel
          /mnt/work/tools/magiskboot repack boot_orig.img /mnt/work/out_release/boot_hyperos_bpf.img

          mkdir -p /mnt/work/boot_verify
          cd /mnt/work/boot_verify
          /mnt/work/tools/magiskboot unpack -h /mnt/work/out_release/boot_hyperos_bpf.img
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("header").read_text().splitlines()
          cmdlines = [line.partition("=")[2] for line in lines if line.startswith("cmdline=")]
          if len(cmdlines) != 1:
              raise SystemExit(f"::error::Se esperaba un cmdline en el boot reempaquetado; encontrados: {len(cmdlines)}")

          tokens = cmdlines[0].split()
          expected = "androidboot.selinux=permissive"
          if tokens.count(expected) != 1 or "androidboot.selinux=enforcing" in tokens:
              raise SystemExit(f"::error::cmdline SELinux inválido tras repack: {cmdlines[0]}")

          print(f"cmdline final de boot_hyperos_bpf.img: {cmdlines[0]}")
          PY

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /mnt/work/AnyKernel3
          cd /mnt/work/AnyKernel3
          rm -rf .git README.md
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=rhode/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=moto_g52/g' anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|BLOCK=auto;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=1;/g' anykernel.sh

          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 /mnt/work/out_release/AnyKernel3-rhode-4.19.325-bpf-spoof.zip ./*

          cp -f /mnt/work/kernel/out/arch/arm64/boot/Image.gz-dtb /mnt/work/out_release/Image.gz-dtb
          ls -lh /mnt/work/out_release/

      - name: Auditar paquete rhode-kernel-modules.tar.gz
        run: |
          set -euo pipefail
          ARCHIVE=/mnt/work/out_release/rhode-kernel-modules.tar.gz
          test -s "$ARCHIVE" || { echo "::error::No existe el paquete de módulos"; exit 1; }
          for artifact in \
            /mnt/work/out_release/AnyKernel3-rhode-4.19.325-bpf-spoof.zip \
            /mnt/work/out_release/Image.gz-dtb \
            /mnt/work/out_release/boot_hyperos_bpf.img; do
            test -s "$artifact" || { echo "::error::Falta el artefacto de Release: $artifact"; exit 1; }
          done

          tar -tzf "$ARCHIVE" | sort > /mnt/work/module_archive_contents.txt
          echo "=== Módulos .ko incluidos ==="
          grep -E '\.ko$' /mnt/work/module_archive_contents.txt | tee /mnt/work/module_archive_ko.txt
          test -s /mnt/work/module_archive_ko.txt || { echo "::error::El paquete no contiene módulos .ko"; exit 1; }

          require_entry() {
            if ! grep -Eq "$1" /mnt/work/module_archive_contents.txt; then
              echo "::error::Falta en el paquete: $2"
              exit 1
            fi
            echo "OK: $2"
          }

          require_entry '(^|/)(goodix|synaptics)[^/]*\.ko$' 'driver táctil Goodix o Synaptics'
          require_entry '(^|/)wlan\.ko$' 'wlan.ko'
          require_entry '(^|/)focal_fps_mmi\.ko$' 'focal_fps_mmi.ko'
          require_entry '(^|/)modules\.dep$' 'modules.dep'
          require_entry '(^|/)modules\.alias$' 'modules.alias'
          require_entry '(^|/)modules\.softdep$' 'modules.softdep'

      - name: Publicar kernel, módulos .ko y boot_hyperos_bpf.img en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-rhode-bpf-spoof
          name: "Kernel 4.19.325 (rhode) - BPF Uname Spoof + Módulos .ko"
          files: |
            /mnt/work/out_release/AnyKernel3-rhode-4.19.325-bpf-spoof.zip
            /mnt/work/out_release/Image.gz-dtb
            /mnt/work/out_release/rhode-kernel-modules.tar.gz
            /mnt/work/out_release/boot_hyperos_bpf.img
