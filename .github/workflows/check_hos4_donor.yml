name: Validate HyperOS EROFS vs Evolution X

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Instalar herramientas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd erofs-utils secilc attr

      - name: Descargar assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/w && cd /tmp/w
          gh release download donor-hyperos4-base --repo "$GITHUB_REPOSITORY" \
            -p 'system.img.zst' -p 'system_ext.img.zst' -p 'product.img.zst.part_*' --dir dl
          gh release download evox-partitions --repo "$GITHUB_REPOSITORY" \
            -p 'system_evox.img.zst' --dir dl
          gh release download evox-extracted --repo "$GITHUB_REPOSITORY" \
            -p 'vendor_evox_meta.tar.gz' --dir dl
          cat dl/product.img.zst.part_* > dl/product.img.zst
          rm -f dl/product.img.zst.part_*
          for f in dl/*.zst; do
            zstd -d -f "$f" -o "$(basename "${f%.zst}")"
            rm -f "$f"
          done
          mkdir -p vmeta && tar -xzf dl/vendor_evox_meta.tar.gz -C vmeta
          ls -lh

      - name: Superblock EROFS - Evolution X (referencia que arranca)
        run: |
          cd /tmp/w
          dump.erofs -s system_evox.img 2>&1 | head -40 || true

      - name: Superblock EROFS - HyperOS system
        run: |
          cd /tmp/w
          dump.erofs -s system.img 2>&1 | head -40 || true

      - name: Superblock EROFS - HyperOS system_ext
        run: |
          cd /tmp/w
          dump.erofs -s system_ext.img 2>&1 | head -40 || true

      - name: Superblock EROFS - HyperOS product
        run: |
          cd /tmp/w
          dump.erofs -s product.img 2>&1 | head -40 || true

      - name: secilc sin la capacidad desconocida (copia)
        run: |
          set -u
          cd /tmp/w
          mkdir -p m_system m_system_ext
          sudo mount -o ro,loop system.img m_system
          sudo mount -o ro,loop system_ext.img m_system_ext
          SYS=m_system/system/etc/selinux
          V=vmeta/vendor_meta/selinux_vendor
          mkdir -p cil
          sudo cp "$SYS/plat_sepolicy.cil" cil/plat.cil
          sudo chown "$(id -u)" cil/plat.cil
          sed -i '/functionfs_seclabel/d' cil/plat.cil
          FILES="cil/plat.cil $SYS/mapping/202604.cil"
          FILES="$FILES m_system_ext/etc/selinux/mapping/202604.cil m_system_ext/etc/selinux/system_ext_sepolicy.cil"
          FILES="$FILES $V/plat_pub_versioned.cil $V/vendor_sepolicy.cil"
          echo "Archivos: $FILES"
          sudo secilc -m -M true -G -N -c 31 -f /dev/null -o /tmp/policy.out $FILES \
            && echo "POLITICA COMPILA" || echo "secilc FALLO (ver mensajes)"
