name: Mirror Evolution X ZIP to GitHub Release

on:
  workflow_dispatch:
    inputs:
      pixeldrain_url:
        description: 'Enlace directo de Pixeldrain (se ignora si ya subiste part_00 y part_01 al Release)'
        required: true
        default: 'https://pixeldrain.com/api/file/Mid9SmHh'
      release_tag:
        description: 'Tag del Release donde se guardará'
        required: true
        default: 'evox-source'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.release_tag }}
      EVOX_URL: ${{ github.event.inputs.pixeldrain_url }}

    steps:
      - name: Guardia (verificar qué ya existe en el Release)
        id: guard
        run: |
          set -u
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)

          if echo "$ASSETS" | grep -q '^vendor_evox.img.zst$' && echo "$ASSETS" | grep -q '^evolutionx_rhode.zip.part_00$'; then
            echo "El Release '$TAG' ya está 100% completo (trozos + imágenes extraídas). No hay nada que hacer."
            echo "skip_all=true" >> "$GITHUB_OUTPUT"
            echo "has_parts=true" >> "$GITHUB_OUTPUT"
          elif echo "$ASSETS" | grep -q '^evolutionx_rhode.zip.part_00$'; then
            echo "Detectados part_00/part_01 subidos manualmente en '$TAG'. Se omite Pixeldrain y se extraen las imágenes."
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            echo "has_parts=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_all=false" >> "$GITHUB_OUTPUT"
            echo "has_parts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar herramientas
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd unzip curl jq

          PDG_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
            | jq -r '[.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$"))][0].browser_download_url')
          if [ -z "$PDG_URL" ] || [ "$PDG_URL" = "null" ]; then
            echo "::error::No se encontró payload-dumper-go para linux_amd64"
            exit 1
          fi

          mkdir -p /tmp/pdg
          curl -fL --retry 5 "$PDG_URL" -o /tmp/pdg.tar.gz
          tar -xzf /tmp/pdg.tar.gz -C /tmp/pdg
          PDG_BIN=$(find /tmp/pdg -type f -name 'payload-dumper-go' | head -n1)
          sudo install -m 755 "$PDG_BIN" /usr/local/bin/payload-dumper-go
          df -h /

      - name: Obtener ZIP (desde Release si ya lo subiste a mano, o desde Pixeldrain)
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/work && cd /tmp/work

          if [ "${{ steps.guard.outputs.has_parts }}" = "true" ]; then
            echo "Descargando trozos desde el Release '$TAG'..."
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'evolutionx_rhode.zip.part_*'
            cat evolutionx_rhode.zip.part_* > evolutionx_rhode.zip
            rm -f evolutionx_rhode.zip.part_*
          else
            echo "Intentando descargar desde Pixeldrain..."
            HTTP=$(curl -L --retry 3 --retry-all-errors --retry-delay 10 -C - \
              -w '%{http_code}' -o evolutionx_rhode.zip "$EVOX_URL" || true)
            echo "HTTP final: $HTTP"
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "206" ]; then
              echo "::error::Pixeldrain devolvió HTTP $HTTP (cupo agotado o IP bloqueada). Solución rápida: parte tu ZIP local en 1900M con 7-Zip (modo Store), súbelos a un Release llamado '$TAG' como evolutionx_rhode.zip.part_00 y part_01, y vuelve a correr este workflow."
              head -c 400 evolutionx_rhode.zip || true
              exit 1
            fi
          fi

          ls -lh evolutionx_rhode.zip
          if ! unzip -tq evolutionx_rhode.zip >/dev/null 2>&1; then
            echo "::error::El ZIP está corrupto o incompleto."
            exit 1
          fi
          unzip -l evolutionx_rhode.zip | grep -q 'payload.bin' || { echo "::error::El ZIP no trae payload.bin"; exit 1; }
          sha256sum evolutionx_rhode.zip | tee evolutionx_rhode.zip.sha256

      - name: Partir el ZIP en trozos de 1900 MB (si vino de Pixeldrain)
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          cd /tmp/work
          mkdir -p release_out
          cp evolutionx_rhode.zip.sha256 release_out/
          if [ "${{ steps.guard.outputs.has_parts }}" != "true" ]; then
            split -b 1900M -d -a 2 evolutionx_rhode.zip release_out/evolutionx_rhode.zip.part_
          fi
          ls -lh release_out/

      - name: Extraer imágenes útiles y comprimirlas con zstd
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          cd /tmp/work
          unzip -p evolutionx_rhode.zip payload.bin > payload.bin
          rm -f evolutionx_rhode.zip

          payload-dumper-go -p vendor,boot,vendor_boot,dtbo,vbmeta,vbmeta_system -o extracted payload.bin >/dev/null
          rm -f payload.bin

          for img in vendor boot vendor_boot dtbo vbmeta vbmeta_system; do
            F=$(find extracted -type f -name "$img.img" | head -n1)
            if [ -z "$F" ]; then
              echo "::warning::No se obtuvo $img.img"
              continue
            fi
            zstd -19 -T0 -f "$F" -o "release_out/${img}_evox.img.zst"
          done
          ls -lh release_out/

      - name: Extraer fstab, selinux y vintf del vendor
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -u
          cd /tmp/work
          mkdir -p mnt_ven "$GITHUB_WORKSPACE/vendor_meta"
          VEN=$(find extracted -type f -name vendor.img | head -n1)
          sudo mount -o ro,loop "$VEN" mnt_ven
          sudo cp -a mnt_ven/etc/fstab* "$GITHUB_WORKSPACE/vendor_meta/" 2>/dev/null || true
          sudo cp -a mnt_ven/etc/selinux "$GITHUB_WORKSPACE/vendor_meta/selinux_vendor" 2>/dev/null || true
          sudo cp -a mnt_ven/etc/vintf "$GITHUB_WORKSPACE/vendor_meta/vintf_vendor" 2>/dev/null || true
          sudo cp -a mnt_ven/build.prop "$GITHUB_WORKSPACE/vendor_meta/vendor_build.prop" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/vendor_meta"
          sudo umount mnt_ven

          echo "=== plat_sepolicy_vers.txt ==="
          cat "$GITHUB_WORKSPACE/vendor_meta/selinux_vendor/plat_sepolicy_vers.txt" || true
          echo "=== fstab* encontrados ==="
          ls -la "$GITHUB_WORKSPACE/vendor_meta/" | grep fstab || true

          tar -czf release_out/vendor_evox_meta.tar.gz -C "$GITHUB_WORKSPACE" vendor_meta

      - name: Publicar en el Release
        if: steps.guard.outputs.skip_all != 'true'
        run: |
          set -euo pipefail
          cd /tmp/work
          SHA=$(cut -d' ' -f1 evolutionx_rhode.zip.sha256)
          cat > notes.md <<EOF
          Copia permanente de Evolution X para rhode (moto g52).
          SHA256 del ZIP completo: \`$SHA\`
          Reconstruir ZIP:
          \`\`\`
          cat evolutionx_rhode.zip.part_* > evolutionx_rhode.zip
          sha256sum evolutionx_rhode.zip
          \`\`\`
          Incluye \`vendor_evox.img.zst\`, \`boot_evox.img.zst\`, \`vendor_boot_evox.img.zst\`, \`dtbo_evox.img.zst\`, \`vbmeta_evox.img.zst\`, \`vbmeta_system_evox.img.zst\` y \`vendor_evox_meta.tar.gz\`.
          EOF

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Evolution X source (rhode)" --notes-file notes.md
          fi

          gh release upload "$TAG" release_out/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)  \(.size)"'

      - name: Subir metadatos del vendor como artefacto rápido
        if: steps.guard.outputs.skip_all != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: evox-vendor-meta
          path: vendor_meta/
          if-no-files-found: warn
