name: "Sesión 2: Extraer Donante HyperOS 4 (spes)"

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "URL directa del ZIP donante de HyperOS 4 (spes)"
        required: true
        default: "https://pixeldrain.com/api/file/trR79icN"
        type: string

permissions:
  contents: write

jobs:
  extract-donor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Preparar almacenamiento en /mnt/work e instalar herramientas
        run: |
          sudo mkdir -p /mnt/work
          sudo chown -R $USER:$USER /mnt/work
          df -h /mnt/work

          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils p7zip-full wget curl tar zstd file xxd unzip clang libc++-dev libc++abi-dev
          mkdir -p /mnt/work/tools
          git clone --depth=1 https://github.com/LonelyFool/lpunpack_and_lpmake.git /mnt/work/tools/src
          find /mnt/work/tools/src -name "*.cpp" -exec sed -i '1i #include <algorithm>' {} +
          cd /mnt/work/tools/src && ./make.sh && cp bin/* ../ && cd -
          rm -rf /mnt/work/tools/src
          chmod +x /mnt/work/tools/lpunpack /mnt/work/tools/lpmake
          echo "/mnt/work/tools" >> $GITHUB_PATH

      - name: Descargar y descomprimir ZIP de HyperOS 4 (spes)
        run: |
          mkdir -p /mnt/work/rom /mnt/work/out /mnt/work/super_extracted
          curl -fL --retry 3 "${{ github.event.inputs.donor_url }}" -o /mnt/work/donor.zip
          ls -lh /mnt/work/donor.zip
          7z x /mnt/work/donor.zip -o/mnt/work/rom/ -y
          rm -f /mnt/work/donor.zip
          find /mnt/work/rom -maxdepth 3 -ls

      - name: Extraer todas las particiones importantes (dinámicas y respaldo)
        run: |
          IMG_DIR=$(find /mnt/work/rom -type d -name "images" | head -n 1)
          [ -z "$IMG_DIR" ] && IMG_DIR="/mnt/work/rom"
          echo "Directorio de imágenes detectado: $IMG_DIR"

          # Caso 1: super.img fragmentado (super.img.0, super.img.1, ...)
          if ls "$IMG_DIR"/super.img.* >/dev/null 2>&1; then
            SUPER_PARTS=$(ls -v "$IMG_DIR"/super.img.*)
            echo "Fusionando fragmentos: $SUPER_PARTS"
            simg2img $SUPER_PARTS /mnt/work/super_raw.img
            lpunpack /mnt/work/super_raw.img /mnt/work/super_extracted/
            rm -f /mnt/work/super_raw.img

          # Caso 2: super.img único (sparse o raw)
          elif [ -f "$IMG_DIR/super.img" ]; then
            if file "$IMG_DIR/super.img" | grep -qi "sparse"; then
              simg2img "$IMG_DIR/super.img" /mnt/work/super_raw.img
              lpunpack /mnt/work/super_raw.img /mnt/work/super_extracted/
              rm -f /mnt/work/super_raw.img
            else
              lpunpack "$IMG_DIR/super.img" /mnt/work/super_extracted/
            fi

          # Caso 3: Imágenes individuales sueltas dentro de images/
          else
            cp -f "$IMG_DIR"/*.img /mnt/work/super_extracted/ 2>/dev/null || true
          fi

          # Copiar también imágenes de arranque/hardware que vengan fuera de super (boot, dtbo, etc.)
          for extra in boot dtbo vendor_boot vbmeta vbmeta_system; do
            if [ -f "$IMG_DIR/${extra}.img" ] && [ ! -f "/mnt/work/super_extracted/${extra}.img" ]; then
              cp -f "$IMG_DIR/${extra}.img" /mnt/work/super_extracted/
            fi
          done

          rm -rf /mnt/work/rom
          ls -lh /mnt/work/super_extracted/

          # Recolectar todas las particiones importantes (preferencia por slot _a o sin sufijo)
          for part in system product system_ext mi_ext vendor odm boot dtbo vendor_boot; do
            FOUND=$(ls /mnt/work/super_extracted/${part}.img /mnt/work/super_extracted/${part}_a.img 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ] && [ -s "$FOUND" ]; then
              echo "Guardando ${part}.img desde $FOUND"
              if file "$FOUND" | grep -qi "sparse"; then
                simg2img "$FOUND" "/mnt/work/out/${part}.img"
              else
                mv "$FOUND" "/mnt/work/out/${part}.img"
              fi
            fi
          done

          rm -rf /mnt/work/super_extracted
          ls -lh /mnt/work/out/

      - name: Extraer JARs del framework, build.prop y validar soporte 32-bit
        run: |
          mkdir -p /mnt/work/jars_for_patch
          for part in system product system_ext vendor; do
            IMG="/mnt/work/out/${part}.img"
            if [ -f "$IMG" ]; then
              echo "Inspeccionando ${part}.img..."
              mkdir -p "/mnt/work/mnt_${part}" "/mnt/work/jars_for_patch/${part}"
              if sudo mount -o ro,loop "$IMG" "/mnt/work/mnt_${part}" 2>/dev/null; then
                MOUNTED=1
              else
                MOUNTED=0
                extract.erofs -i "$IMG" -o "/mnt/work/mnt_${part}" -x 2>/dev/null || 7z x "$IMG" -o"/mnt/work/mnt_${part}" -y >/dev/null 2>&1 || true
              fi

              if [ "$part" = "system" ]; then
                echo "=== Verificación de arquitectura 64_32 en system ==="
                find "/mnt/work/mnt_${part}" -name "app_process*" -ls || true
              fi

              find "/mnt/work/mnt_${part}" -maxdepth 4 \( \
                -name "services.jar" -o \
                -name "framework.jar" -o \
                -name "miui-services.jar" -o \
                -name "build.prop" \
              \) -exec cp --parents {} "/mnt/work/jars_for_patch/${part}/" \; 2>/dev/null || true

              if [ "$MOUNTED" -eq 1 ]; then
                sudo umount "/mnt/work/mnt_${part}"
              fi
              rm -rf "/mnt/work/mnt_${part}"
            fi
          done

          echo "=== Archivos extraídos para referencia ==="
          find /mnt/work/jars_for_patch -type f
          tar -czf /mnt/work/jars_and_props_spes.tar.gz -C /mnt/work/jars_for_patch .
          ls -lh /mnt/work/jars_and_props_spes.tar.gz

      - name: Comprimir particiones individuales por debajo de 1.8 GB
        run: |
          cd /mnt/work/out
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "Comprimiendo $img..."
              zstd -T0 -9 "$img" -o "${img}.zst"
              rm -f "$img"
              SIZE=$(stat -c%s "${img}.zst")
              if [ "$SIZE" -gt 1900000000 ]; then
                echo "$img.zst supera 1.9 GB ($SIZE bytes), dividiendo en partes de 1.8 GB..."
                split -b 1800M "${img}.zst" "${img}.zst.part_"
                rm -f "${img}.zst"
              fi
            fi
          done
          ls -lh

      - name: Publicar particiones base de HyperOS 4 (spes) en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: donor-hyperos4-spes
          name: "Donante HyperOS 4 (spes OS4.0.0.22) - Particiones y JARs"
          files: |
            /mnt/work/out/*
            /mnt/work/jars_and_props_spes.tar.gz
