name: "Sesión 2: Extraer Donante HyperOS 4 (sapphiren)"

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "URL directa del ZIP donante de HyperOS 4 (sapphiren)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract-donor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de extracción (lpunpack, simg2img, erofs-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils android-sdk-libsparse-utils p7zip-full wget curl tar zstd file xxd unzip clang libc++-dev libc++abi-dev
          mkdir -p tools
          git clone --depth=1 https://github.com/LonelyFool/lpunpack_and_lpmake.git tools/src
          find tools/src -name "*.cpp" -exec sed -i '1i #include <algorithm>' {} +
          cd tools/src && ./make.sh && cp bin/* ../ && cd ../..
          rm -rf tools/src
          chmod +x tools/lpunpack tools/lpmake
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Descargar y descomprimir ZIP de HyperMOD OS4.0.30.0
        run: |
          mkdir -p work/rom work/out work/super_extracted
          curl -fL "${{ github.event.inputs.donor_url }}" -o work/donor.zip
          7z x work/donor.zip -owork/rom/ -y
          rm -f work/donor.zip

      - name: Fusionar super.img.0..11 con simg2img y extraer particiones con lpunpack
        run: |
          # Ordenar numéricamente super.img.0, super.img.1 ... super.img.11
          SUPER_PARTS=$(ls -v work/rom/images/super.img.*)
          echo "Fragmentos encontrados:"
          echo "$SUPER_PARTS"

          simg2img $SUPER_PARTS work/super_raw.img
          rm -rf work/rom
          ls -lh work/super_raw.img

          lpunpack work/super_raw.img work/super_extracted/
          rm -f work/super_raw.img
          ls -lh work/super_extracted/

          for part in system product system_ext mi_ext; do
            FOUND=$(ls work/super_extracted/${part}*.img 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ] && [ -s "$FOUND" ]; then
              mv "$FOUND" "work/out/${part}.img"
            fi
          done
          rm -rf work/super_extracted
          ls -lh work/out/

      - name: Extraer JARs del framework y build.prop desde EROFS/EXT4 (Sesión 3)
        run: |
          mkdir -p work/jars_for_patch
          for part in system product system_ext; do
            IMG="work/out/${part}.img"
            if [ -f "$IMG" ]; then
              echo "Extrayendo archivos clave de ${part}.img..."
              mkdir -p "work/mnt_${part}" "work/jars_for_patch/${part}"
              # Intentar montaje o extracción nativa EROFS
              if sudo mount -o ro,loop "$IMG" "work/mnt_${part}" 2>/dev/null; then
                find "work/mnt_${part}" -maxdepth 4 \( \
                  -name "services.jar" -o \
                  -name "framework.jar" -o \
                  -name "miui-services.jar" -o \
                  -name "build.prop" \
                \) -exec cp --parents {} "work/jars_for_patch/${part}/" \; 2>/dev/null || true
                sudo umount "work/mnt_${part}"
              else
                extract.erofs -i "$IMG" -o "work/mnt_${part}" -x || 7z x "$IMG" -o"work/mnt_${part}" -y || true
                find "work/mnt_${part}" -maxdepth 4 \( \
                  -name "services.jar" -o \
                  -name "framework.jar" -o \
                  -name "miui-services.jar" -o \
                  -name "build.prop" \
                \) -exec cp --parents {} "work/jars_for_patch/${part}/" \; 2>/dev/null || true
              fi
              rm -rf "work/mnt_${part}"
            fi
          done
          echo "=== Archivos extraídos para Sesión 3 ==="
          find work/jars_for_patch -type f
          tar -czf work/jars_and_props_hyperos4.tar.gz -C work/jars_for_patch .
          ls -lh work/jars_and_props_hyperos4.tar.gz

      - name: Comprimir particiones individuales por debajo de 1.8 GB
        run: |
          cd work/out
          for img in system.img product.img system_ext.img mi_ext.img; do
            if [ -f "$img" ]; then
              echo "Comprimiendo $img..."
              zstd -T0 -9 "$img" -o "${img}.zst"
              rm -f "$img"
              SIZE=$(stat -c%s "${img}.zst")
              if [ "$SIZE" -gt 1900000000 ]; then
                echo "$img.zst supera 1.9 GB ($SIZE bytes), dividiendo en partes de 1.8 GB..."
                split -b 1800M "${img}.zst" "${img}.zst.part_"
                rm -f "${img}.zst"
              fi
            fi
          done
          ls -lh

      - name: Publicar particiones base de HyperOS 4 en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: donor-hyperos4-base
          name: "Donante HyperOS 4 (sapphiren OS4.0.30.0) - Particiones y JARs"
          files: |
            work/out/*
            work/jars_and_props_hyperos4.tar.gz
