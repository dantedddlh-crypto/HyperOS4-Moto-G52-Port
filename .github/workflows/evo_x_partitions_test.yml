name: Extract Evolution X partitions for slot A test

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag con los trozos del ZIP'
        required: true
        default: 'evox-source'
      output_tag:
        description: 'Tag de salida'
        required: true
        default: 'evox-partitions'
      expected_sha256:
        description: 'SHA256 esperado del ZIP'
        required: true
        default: '4d557f91b67c637dd8368fc5c64738c68eec3c96e0098e87d4a0bc6a529b7cdb'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_TAG: ${{ github.event.inputs.source_tag }}
      OUT_TAG: ${{ github.event.inputs.output_tag }}
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha256 }}

    steps:
      - name: Instalar herramientas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd unzip curl jq
          PDG_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
            | jq -r '[.assets[] | select(.name | test("linux_amd64\\.tar\\.gz$"))][0].browser_download_url')
          [ -n "$PDG_URL" ] && [ "$PDG_URL" != "null" ] || { echo "::error::payload-dumper-go no encontrado"; exit 1; }
          mkdir -p /tmp/pdg
          curl -fL --retry 5 "$PDG_URL" -o /tmp/pdg.tar.gz
          tar -xzf /tmp/pdg.tar.gz -C /tmp/pdg
          sudo install -m 755 "$(find /tmp/pdg -type f -name payload-dumper-go | head -n1)" /usr/local/bin/payload-dumper-go

      - name: Descargar, unir y verificar el ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/work && cd /tmp/work
          gh release download "$SRC_TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'evolutionx_rhode.zip.part_*' --dir parts
          cat parts/evolutionx_rhode.zip.part_* > evolutionx_rhode.zip
          rm -rf parts
          ACTUAL=$(sha256sum evolutionx_rhode.zip | cut -d' ' -f1)
          echo "Esperado: $EXPECTED_SHA"
          echo "Obtenido: $ACTUAL"
          [ "${ACTUAL,,}" = "${EXPECTED_SHA,,}" ] || { echo "::error::SHA256 no coincide"; exit 1; }

      - name: Extraer particiones del payload
        run: |
          set -euo pipefail
          cd /tmp/work
          unzip -p evolutionx_rhode.zip payload.bin > payload.bin
          rm -f evolutionx_rhode.zip
          payload-dumper-go -p system,system_ext,product,vendor -o extracted payload.bin > /dev/null
          rm -f payload.bin
          find extracted -type f -name '*.img' -exec ls -lh {} \;

      - name: Comprimir y partir si hace falta
        run: |
          set -euo pipefail
          cd /tmp/work
          mkdir -p release_out
          for img in system system_ext product vendor; do
            F=$(find extracted -type f -name "$img.img" | head -n1)
            [ -n "$F" ] || { echo "::error::falta $img.img"; exit 1; }
            sha256sum "$F" | sed 's#  .*/#  #' >> release_out/images.sha256
            zstd -12 -T0 -f "$F" -o "release_out/${img}_evox.img.zst"
          done
          for z in release_out/*.zst; do
            SIZE=$(stat -c %s "$z")
            if [ "$SIZE" -gt 2000000000 ]; then
              echo "Partiendo $z ($SIZE bytes)"
              split -b 1900M -d -a 2 "$z" "$z.part_"
              rm -f "$z"
            fi
          done
          ls -lh release_out/
          cat release_out/images.sha256

      - name: Publicar en el Release
        run: |
          set -euo pipefail
          cd /tmp/work
          {
            echo "Particiones de Evolution X (rhode) para probar el pipeline en el slot A."
            echo "SHA256 del ZIP origen: \`$EXPECTED_SHA\`"
            echo "images.sha256 tiene los hashes de las imágenes ya descomprimidas."
          } > notes.md
          if ! gh release view "$OUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$OUT_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Evolution X partitions (rhode)" --notes-file notes.md --latest=false
          fi
          gh release upload "$OUT_TAG" release_out/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$OUT_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)  \(.size)"'
