name: Build HyperOS 4 Alpha 2 (Option A - Raw EROFS + mi_ext + Precompiled SEPolicy)

on:
  workflow_dispatch:
    inputs:
      donor_tag:
        description: 'Release tag de imágenes HyperOS 4 donor'
        required: true
        default: 'donor-hyperos4-base'
      evox_tag:
        description: 'Release tag de Evolution X Base'
        required: true
        default: 'evox-source'
      output_tag:
        description: 'Release tag destino para Alpha 2'
        required: true
        default: 'hyperos4-rhode-alpha2'

jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Liberar espacio en disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo mkdir -p /mnt/work
          sudo chown -R $USER:$USER /mnt/work

      - name: Instalar herramientas Android / EROFS / SELinux / Bootimg
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd erofs-utils android-sdk-libsparse-utils secilc cpio lz4 python3-pip git wget unzip
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg /mnt/work/mkbootimg
          sudo chmod +x /mnt/work/mkbootimg/unpack_bootimg.py /mnt/work/mkbootimg/mkbootimg.py

      - name: Descargar assets de evox-source y donor-hyperos4-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /mnt/work/evox /mnt/work/donor /mnt/work/out
          gh release download "${{ github.event.inputs.evox_tag }}" \
            -R "${{ github.repository }}" \
            -p "vendor_evox.img.zst" \
            -p "vendor_boot_evox.img.zst" \
            -p "vbmeta_evox.img.zst" \
            -p "vbmeta_system_evox.img.zst" \
            -D /mnt/work/evox
          gh release download "${{ github.event.inputs.donor_tag }}" \
            -R "${{ github.repository }}" \
            -D /mnt/work/donor

      - name: Descomprimir imágenes base
        run: |
          cd /mnt/work/evox
          for f in *.zst; do [ -f "$f" ] && zstd -d "$f" -o "${f%.zst}"; done
          cd /mnt/work/donor
          for f in *.zst; do [ -f "$f" ] && zstd -d "$f" -o "${f%.zst}"; done
          if ls product.img.part_* 1> /dev/null 2>&1; then
            cat product.img.part_* > product.img
          fi

      - name: 1. Compilar precompiled_sepolicy y calcular hashes SHA-256 reales de HyperOS 4
        run: |
          mkdir -p /mnt/work/mnt_sys /mnt/work/mnt_ext /mnt/work/mnt_prod /mnt/work/mnt_mi /mnt/work/mnt_ven /mnt/work/selinux_build
          sudo mount -o loop,ro /mnt/work/donor/system.img /mnt/work/mnt_sys
          sudo mount -o loop,ro /mnt/work/donor/system_ext.img /mnt/work/mnt_ext
          sudo mount -o loop,ro /mnt/work/donor/product.img /mnt/work/mnt_prod
          sudo mount -o loop,ro /mnt/work/donor/mi_ext.img /mnt/work/mnt_mi
          sudo mount -o loop,ro /mnt/work/evox/vendor_evox.img /mnt/work/mnt_ven

          VENDOR_VER=$(cat /mnt/work/mnt_ven/etc/selinux/plat_sepolicy_vers.txt | tr -d '[:space:]')
          echo "Versión SELinux vendor: $VENDOR_VER"

          # Copiar .cil de todas las particiones
          cp /mnt/work/mnt_sys/system/etc/selinux/plat_sepolicy.cil /mnt/work/selinux_build/
          cp /mnt/work/mnt_sys/system/etc/selinux/mapping/${VENDOR_VER}.cil /mnt/work/selinux_build/
          cp /mnt/work/mnt_sys/system/etc/selinux/mapping/${VENDOR_VER}.compat.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp /mnt/work/mnt_ext/etc/selinux/system_ext_sepolicy.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp /mnt/work/mnt_ext/etc/selinux/mapping/${VENDOR_VER}.cil /mnt/work/selinux_build/system_ext_mapping.cil 2>/dev/null || true
          cp /mnt/work/mnt_prod/etc/selinux/product_sepolicy.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp /mnt/work/mnt_prod/etc/selinux/mapping/${VENDOR_VER}.cil /mnt/work/selinux_build/product_mapping.cil 2>/dev/null || true
          cp /mnt/work/mnt_mi/etc/selinux/*.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp /mnt/work/mnt_ven/etc/selinux/vendor_sepolicy.cil /mnt/work/selinux_build/
          cp /mnt/work/mnt_ven/etc/selinux/plat_pub_versioned.cil /mnt/work/selinux_build/

          # Calcular los SHA-256 exactos que init verifica al arrancar (usando archivos originales sin modificar)
          cat /mnt/work/mnt_sys/system/etc/selinux/plat_sepolicy.cil \
              /mnt/work/mnt_sys/system/etc/selinux/mapping/${VENDOR_VER}.cil \
              /mnt/work/mnt_sys/system/etc/selinux/mapping/${VENDOR_VER}.compat.cil 2>/dev/null | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/plat_and_mapping.sha256

          cat /mnt/work/mnt_ext/etc/selinux/system_ext_sepolicy.cil \
              /mnt/work/mnt_ext/etc/selinux/mapping/${VENDOR_VER}.cil 2>/dev/null | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/system_ext_and_mapping.sha256

          cat /mnt/work/mnt_prod/etc/selinux/product_sepolicy.cil \
              /mnt/work/mnt_prod/etc/selinux/mapping/${VENDOR_VER}.cil 2>/dev/null | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/product_and_mapping.sha256

          # Deduplicar declaraciones (typeattribute ...) repetidas en plat_sepolicy.cil para compilar el binario
          python3 - << 'EOF'
          import glob

          seen_attrs = set()
          files = [
              "/mnt/work/selinux_build/plat_sepolicy.cil",
              "/mnt/work/selinux_build/202604.cil",
              "/mnt/work/selinux_build/202604.compat.cil",
              "/mnt/work/selinux_build/system_ext_sepolicy.cil",
              "/mnt/work/selinux_build/system_ext_mapping.cil",
              "/mnt/work/selinux_build/product_sepolicy.cil",
              "/mnt/work/selinux_build/product_mapping.cil",
              "/mnt/work/selinux_build/plat_pub_versioned.cil",
              "/mnt/work/selinux_build/vendor_sepolicy.cil",
          ]
          for path in files:
              try:
                  with open(path, "r") as f:
                      lines = f.readlines()
              except FileNotFoundError:
                  continue
              out_lines = []
              for line in lines:
                  s = line.strip()
                  if s.startswith("(typeattribute ") and s.endswith(")"):
                      if s in seen_attrs:
                          print(f"Eliminando duplicado en {path}: {s}")
                          continue
                      seen_attrs.add(s)
                  out_lines.append(line)
              with open(path, "w") as f:
                  f.writelines(out_lines)
          EOF

          CIL_LIST=""
          for f in plat_sepolicy.cil ${VENDOR_VER}.cil ${VENDOR_VER}.compat.cil system_ext_sepolicy.cil system_ext_mapping.cil product_sepolicy.cil product_mapping.cil plat_pub_versioned.cil vendor_sepolicy.cil; do
            [ -f "/mnt/work/selinux_build/$f" ] && CIL_LIST="$CIL_LIST /mnt/work/selinux_build/$f"
          done

          echo "=== Compilando precompiled_sepolicy ==="
          secilc -M true -G -N $CIL_LIST \
            -o /mnt/work/selinux_build/precompiled_sepolicy \
            -f /dev/null

          ls -lh /mnt/work/selinux_build/precompiled_sepolicy
          sudo umount /mnt/work/mnt_sys /mnt/work/mnt_ext /mnt/work/mnt_prod /mnt/work/mnt_mi /mnt/work/mnt_ven

      - name: 2. Parchear vendor_evox.img (fstab + precompiled_sepolicy + hashes SHA-256)
        run: |
          mkdir -p /mnt/work/vendor_dir
          if file /mnt/work/evox/vendor_evox.img | grep -qi "EROFS"; then
            fsck.erofs --extract=/mnt/work/vendor_dir /mnt/work/evox/vendor_evox.img
          else
            mkdir -p /mnt/work/mnt_ven
            sudo mount -o loop,ro /mnt/work/evox/vendor_evox.img /mnt/work/mnt_ven
            sudo cp -aAX /mnt/work/mnt_ven/. /mnt/work/vendor_dir/
            sudo umount /mnt/work/mnt_ven
          fi

          # Inyectar precompiled_sepolicy y los nuevos hashes SHA-256
          sudo cp /mnt/work/selinux_build/precompiled_sepolicy /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy
          sudo cp /mnt/work/selinux_build/plat_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.plat_sepolicy_and_mapping.sha256
          sudo cp /mnt/work/selinux_build/system_ext_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.system_ext_sepolicy_and_mapping.sha256
          sudo cp /mnt/work/selinux_build/product_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.product_sepolicy_and_mapping.sha256

          # Parchear fstab
          for FSTAB in /mnt/work/vendor_dir/etc/fstab.*; do
            [ -f "$FSTAB" ] || continue
            echo "=== Parcheando $FSTAB ==="
            if ! grep -q "^mi_ext[[:space:]]" "$FSTAB"; then
              sudo sed -i '/^product[[:space:]]/a mi_ext                                                  /mi_ext              erofs   ro                                                   wait,slotselect,logical,first_stage_mount' "$FSTAB"
            fi
            sudo sed -i 's/,avb=[^,]*//g; s/,avb//g; s/avb=[^,]*,//g' "$FSTAB"
            sudo sed -i 's/fileencryption=[^,]*,//g; s/,fileencryption=[^,]*//g' "$FSTAB"
          done

          sudo mkfs.erofs -zlz4hc,9 \
            --file-contexts=/mnt/work/vendor_dir/etc/selinux/vendor_file_contexts \
            /mnt/work/out/vendor_evox_patched.img \
            /mnt/work/vendor_dir

      - name: 3. Parchear fstab dentro de vendor_boot_evox.img
        run: |
          mkdir -p /mnt/work/vboot_out /mnt/work/ramdisk_dir
          python3 /mnt/work/mkbootimg/unpack_bootimg.py \
            --boot_img /mnt/work/evox/vendor_boot_evox.img \
            --out /mnt/work/vboot_out \
            --format mkbootimg > /mnt/work/mkbootimg_args.txt

          cd /mnt/work/ramdisk_dir
          RAMDISK_FILE=$(ls /mnt/work/vboot_out/vendor_ramdisk* | head -n 1)
          if file "$RAMDISK_FILE" | grep -qi "LZ4"; then
            lz4 -d "$RAMDISK_FILE" -c | cpio -idmv
          else
            gzip -dc "$RAMDISK_FILE" | cpio -idmv
          fi

          for FSTAB in $(find /mnt/work/ramdisk_dir -name "fstab.*"); do
            echo "=== Parcheando ramdisk fstab: $FSTAB ==="
            if ! grep -q "^mi_ext[[:space:]]" "$FSTAB"; then
              sed -i '/^product[[:space:]]/a mi_ext                                                  /mi_ext              erofs   ro                                                   wait,slotselect,logical,first_stage_mount' "$FSTAB"
            fi
            sed -i 's/,avb=[^,]*//g; s/,avb//g; s/avb=[^,]*,//g' "$FSTAB"
          done

          find . | cpio -o -H newc | lz4 -l -12 --favor-decSpeed > "$RAMDISK_FILE"

          ARGS=$(cat /mnt/work/mkbootimg_args.txt)
          eval "python3 /mnt/work/mkbootimg/mkbootimg.py $ARGS --vendor_boot /mnt/work/out/vendor_boot_patched.img"

      - name: Comprimir y publicar artefactos en Release Alpha 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /mnt/work/out
          for img in *.img; do
            [ -f "$img" ] && zstd -19 -T0 "$img" -o "${img}.zst"
          done
          gh release create "${{ github.event.inputs.output_tag }}" \
            -R "${{ github.repository }}" \
            --title "HyperOS 4 Rhode Alpha 2 (Option A - Raw EROFS + mi_ext + Precompiled SEPolicy)" \
            --notes "vendor_evox y vendor_boot parcheados con mi_ext_a y precompiled_sepolicy compilado contra HyperOS 4." \
            /mnt/work/out/*.zst || gh release upload "${{ github.event.inputs.output_tag }}" -R "${{ github.repository }}" /mnt/work/out/*.zst --clobber
