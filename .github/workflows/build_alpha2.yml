name: "Ensamblar super_hyperos.img (Alpha 2 - lpmake 7583301632 + EROFS/VNDK30 + SELinux SHA256 + Módulos .ko)"

on:
  workflow_dispatch:
    inputs:
      donor_tag:
        description: "Tag del Release con las particiones del donante HyperOS 4"
        required: true
        default: "donor-hyperos4-spes"
        type: string
      evox_tag:
        description: "Tag del Release con vendor_evox y boot_evox extraídos"
        required: true
        default: "evox-extracted"
        type: string
      kernel_tag:
        description: "Tag del Release con Image.gz-dtb y rhode-kernel-modules.tar.gz"
        required: true
        default: "kernel-rhode-bpf-spoof"
        type: string

permissions:
  contents: write

jobs:
  build-super:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio en runner e instalar herramientas Android / EROFS / SELinux moderno
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo mkdir -p /mnt/work/{downloads,images,mounts,vendor_dir,selinux_build,boot_repack,out,bin}
          sudo chown -R $USER:$USER /mnt/work
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils attr build-essential clang libc++-dev libc++abi-dev flex bison libpcre2-dev e2fsprogs erofs-utils f2fs-tools p7zip-full python3 rsync selinux-utils zstd unzip wget curl

          # Compilar libsepol y secilc moderno apuntando a sus propias cabeceras (sin manuales xmlto)
          git clone --depth=1 https://github.com/SELinuxProject/selinux.git /mnt/work/selinux_src
          make -C /mnt/work/selinux_src/libsepol install DESTDIR=/mnt/work/sepol_root -j$(nproc)
          make -C /mnt/work/selinux_src/secilc secilc \
            CFLAGS="-O2 -I/mnt/work/sepol_root/usr/include" \
            LDFLAGS="-L/mnt/work/sepol_root/usr/lib -L/mnt/work/sepol_root/lib" \
            -j$(nproc)
          sudo cp -f /mnt/work/selinux_src/secilc/secilc /usr/local/bin/secilc
          sudo cp -a /mnt/work/sepol_root/lib/libsepol* /usr/local/lib/ 2>/dev/null || true
          sudo cp -a /mnt/work/sepol_root/usr/lib/libsepol* /usr/local/lib/ 2>/dev/null || true
          sudo ldconfig
          test -x /usr/local/bin/secilc && echo "secilc moderno compilado e instalado correctamente"

          # Compilar lpmake desde su fuente, igual que en el flujo de extracción
          rm -rf /mnt/work/lptools_src
          git clone --depth=1 https://github.com/LonelyFool/lpunpack_and_lpmake.git /mnt/work/lptools_src
          find /mnt/work/lptools_src -name "*.cpp" -exec sed -i '1i #include <algorithm>' {} +
          cd /mnt/work/lptools_src
          ./make.sh
          sudo install -m 755 bin/lpmake /usr/local/bin/lpmake
          cd $GITHUB_WORKSPACE
          test -x /usr/local/bin/lpmake
          /usr/local/bin/lpmake --help | head -n 3

          curl -fL "https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk" -o /mnt/work/magisk.apk
          unzip -p /mnt/work/magisk.apk lib/x86_64/libmagiskboot.so > /mnt/work/magiskboot
          chmod +x /mnt/work/magiskboot
          rm -f /mnt/work/magisk.apk

      - name: Descargar assets y reempaquetar boot_hyperos_bpf.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.donor_tag }}" --repo "${{ github.repository }}" --dir /mnt/work/downloads/donor
          gh release download "${{ github.event.inputs.evox_tag }}" --repo "${{ github.repository }}" --dir /mnt/work/downloads/evox
          gh release download "${{ github.event.inputs.kernel_tag }}" --repo "${{ github.repository }}" --dir /mnt/work/downloads/kernel

          BOOT_ZST="/mnt/work/downloads/evox/boot_evox.img.zst"
          test -f "$BOOT_ZST" || { echo "ERROR: falta el asset exacto boot_evox.img.zst"; exit 1; }
          cd /mnt/work/boot_repack
          zstd -d "$BOOT_ZST" -o boot_orig.img
          /mnt/work/magiskboot unpack boot_orig.img
          cp -f /mnt/work/downloads/kernel/Image.gz-dtb kernel
          /mnt/work/magiskboot repack boot_orig.img /mnt/work/out/boot_hyperos_bpf.img
          ls -lh /mnt/work/out/boot_hyperos_bpf.img

      - name: Descomprimir y reconstruir particiones base
        run: |
          cd /mnt/work/images

          if ls /mnt/work/downloads/donor/product.img.zst.part_* >/dev/null 2>&1; then
            cat /mnt/work/downloads/donor/product.img.zst.part_* > product.img.zst
            zstd -d product.img.zst -o product.img
            rm -f product.img.zst
          elif [ -f /mnt/work/downloads/donor/product.img.zst ]; then
            zstd -d /mnt/work/downloads/donor/product.img.zst -o product.img
          fi

          zstd -d /mnt/work/downloads/donor/system.img.zst -o system.img
          zstd -d /mnt/work/downloads/donor/system_ext.img.zst -o system_ext.img

          if [ -f /mnt/work/downloads/donor/mi_ext.img.zst ]; then
            zstd -d /mnt/work/downloads/donor/mi_ext.img.zst -o mi_ext.img
          fi

          VENDOR_ZST="/mnt/work/downloads/evox/vendor_evox.img.zst"
          test -f "$VENDOR_ZST" || { echo "ERROR: falta el asset exacto vendor_evox.img.zst"; exit 1; }
          zstd -d "$VENDOR_ZST" -o vendor_orig.img

          VENDOR_BOOT_ZST="/mnt/work/downloads/evox/vendor_boot_evox.img.zst"
          test -f "$VENDOR_BOOT_ZST" || { echo "ERROR: falta el asset exacto vendor_boot_evox.img.zst"; exit 1; }
          zstd -d "$VENDOR_BOOT_ZST" -o vendor_boot.img

          for img in system system_ext product vendor_orig mi_ext; do
            [ -f "${img}.img" ] || continue
            if file "${img}.img" | grep -q "Android sparse image"; then
              simg2img "${img}.img" "${img}_raw.img"
              mv "${img}_raw.img" "${img}.img"
            fi
          done

          ls -lh /mnt/work/images/

      - name: Debloat, fusión de mi_ext en product, ajustes DPI 400 / 90Hz y compactación
        run: |
          mkdir -p /mnt/work/mounts/{prod_rw,sys_rw,sysext_ro,miext_ro}

          for part in system system_ext product; do
            rm -rf /mnt/work/erofs_${part} && mkdir -p /mnt/work/erofs_${part}
            if fsck.erofs --extract=/mnt/work/erofs_${part} /mnt/work/images/${part}.img 2>/dev/null && [ "$(ls -A /mnt/work/erofs_${part})" ]; then
              echo "Extrayendo $part desde EROFS a ext4..."
              USED_KB=$(du -sk /mnt/work/erofs_${part} | awk '{print $1}')
              SIZE_B=$(( ((USED_KB + 1048576) * 1024 / 4096) * 4096 ))
              rm -f /mnt/work/images/${part}.img
              truncate -s "$SIZE_B" /mnt/work/images/${part}.img
              mke2fs -t ext4 -b 4096 -L "$part" -O ^has_journal /mnt/work/images/${part}.img
              sudo e2fsdroid -e -a "/$part" -f /mnt/work/erofs_${part} /mnt/work/images/${part}.img
            fi
            rm -rf /mnt/work/erofs_${part}
          done

          truncate -s +1200M /mnt/work/images/product.img
          e2fsck -fy /mnt/work/images/product.img || true
          resize2fs /mnt/work/images/product.img

          truncate -s +512M /mnt/work/images/system.img
          e2fsck -fy /mnt/work/images/system.img || true
          resize2fs /mnt/work/images/system.img

          sudo mount -o rw,loop /mnt/work/images/product.img /mnt/work/mounts/prod_rw
          sudo rm -rf \
            /mnt/work/mounts/prod_rw/app/MiBrowser* \
            /mnt/work/mounts/prod_rw/app/MiVideo* \
            /mnt/work/mounts/prod_rw/app/Music* \
            /mnt/work/mounts/prod_rw/app/GameCenter* \
            /mnt/work/mounts/prod_rw/app/YouTube* \
            /mnt/work/mounts/prod_rw/app/Maps* \
            /mnt/work/mounts/prod_rw/app/Gmail2* \
            /mnt/work/mounts/prod_rw/app/Photos* \
            /mnt/work/mounts/prod_rw/app/Drive* \
            /mnt/work/mounts/prod_rw/app/Videos* \
            /mnt/work/mounts/prod_rw/app/Velvet* \
            /mnt/work/mounts/prod_rw/priv-app/MiBrowser* \
            /mnt/work/mounts/prod_rw/priv-app/GameCenter* \
            /mnt/work/mounts/prod_rw/priv-app/Velvet* \
            /mnt/work/mounts/prod_rw/data-app/*

          if [ -f /mnt/work/images/mi_ext.img ]; then
            rm -rf /mnt/work/mounts/miext_ro && mkdir -p /mnt/work/mounts/miext_ro
            if fsck.erofs --extract=/mnt/work/mounts/miext_ro /mnt/work/images/mi_ext.img 2>/dev/null && [ "$(ls -A /mnt/work/mounts/miext_ro)" ]; then
              sudo cp -rn /mnt/work/mounts/miext_ro/* /mnt/work/mounts/prod_rw/ 2>/dev/null || true
              rm -rf /mnt/work/mounts/miext_ro
            else
              sudo mount -o ro,loop /mnt/work/images/mi_ext.img /mnt/work/mounts/miext_ro
              sudo cp -rn /mnt/work/mounts/miext_ro/* /mnt/work/mounts/prod_rw/ 2>/dev/null || true
              sudo umount /mnt/work/mounts/miext_ro
            fi
          fi

          PROD_PROP="/mnt/work/mounts/prod_rw/etc/build.prop"
          if [ -f "$PROD_PROP" ]; then
            sudo sed -i '/ro.sf.lcd_density=/d' "$PROD_PROP"
            echo "ro.sf.lcd_density=400" | sudo tee -a "$PROD_PROP" >/dev/null
            echo "ro.surface_flinger.use_smart_90_for_video=true" | sudo tee -a "$PROD_PROP" >/dev/null
          fi
          sudo umount /mnt/work/mounts/prod_rw

          sudo mount -o rw,loop /mnt/work/images/system.img /mnt/work/mounts/sys_rw
          sudo rm -rf \
            /mnt/work/mounts/sys_rw/system/app/MSA* \
            /mnt/work/mounts/sys_rw/system/app/AnalyticsCore* \
            /mnt/work/mounts/sys_rw/system/priv-app/MSA* \
            /mnt/work/mounts/sys_rw/system/data-app/*
          sudo umount /mnt/work/mounts/sys_rw

          for img in system system_ext product; do
            e2fsck -fy /mnt/work/images/${img}.img || true
            resize2fs -M /mnt/work/images/${img}.img
          done

      - name: Extraer vendor_evox, inyectar módulos .ko, compilar SELinux + SHA-256 y reempaquetar vendor
        run: |
          IS_VENDOR_EROFS=0
          rm -rf /mnt/work/vendor_dir && mkdir -p /mnt/work/vendor_dir
          if fsck.erofs --extract=/mnt/work/vendor_dir /mnt/work/images/vendor_orig.img 2>/dev/null && [ -d /mnt/work/vendor_dir/etc ]; then
            IS_VENDOR_EROFS=1
            echo "vendor_orig.img extraído correctamente como EROFS"
          else
            rm -rf /mnt/work/vendor_dir && mkdir -p /mnt/work/vendor_dir /mnt/work/mounts/vendor_ro
            sudo mount -o ro,loop /mnt/work/images/vendor_orig.img /mnt/work/mounts/vendor_ro
            sudo rsync -aAX /mnt/work/mounts/vendor_ro/ /mnt/work/vendor_dir/
            sudo umount /mnt/work/mounts/vendor_ro
            echo "vendor_orig.img extraído correctamente como ext4"
          fi

          # 1. Inyectar módulos .ko nuevos compilados con kernel 4.19.325 BPF
          mkdir -p /mnt/work/ko_new
          tar -xzf /mnt/work/downloads/kernel/rhode-kernel-modules.tar.gz -C /mnt/work/ko_new
          REPLACED=0
          while IFS= read -r -d '' existing_ko; do
            ko_name=$(basename "$existing_ko")
            new_ko=$(find /mnt/work/ko_new -type f -name "$ko_name" -print -quit)
            if [ -n "$new_ko" ]; then
              sudo cp -f "$new_ko" "$existing_ko"
              sudo chmod 0644 "$existing_ko"
              REPLACED=$((REPLACED + 1))
            fi
          done < <(find /mnt/work/vendor_dir/lib/modules -type f -name "*.ko" -print0 2>/dev/null)
          echo "Módulos .ko reemplazados en vendor: $REPLACED"

          # 2. Compilar precompiled_sepolicy y generar los 3 archivos .sha256 exactos para init
          mkdir -p /mnt/work/mounts/{sys_ro,sysext_ro,prod_ro}
          sudo mount -o ro,loop /mnt/work/images/system.img /mnt/work/mounts/sys_ro
          sudo mount -o ro,loop /mnt/work/images/system_ext.img /mnt/work/mounts/sysext_ro
          sudo mount -o ro,loop /mnt/work/images/product.img /mnt/work/mounts/prod_ro

          VENDOR_VER=$(cat /mnt/work/vendor_dir/etc/selinux/plat_sepolicy_vers.txt | tr -d '[:space:]')
          echo "Versión SELinux vendor: $VENDOR_VER"

          SYS_SE="/mnt/work/mounts/sys_ro/system/etc/selinux"
          [ ! -d "$SYS_SE" ] && SYS_SE="/mnt/work/mounts/sys_ro/etc/selinux"

          cp -f "$SYS_SE/plat_sepolicy.cil" /mnt/work/selinux_build/
          cp -f "$SYS_SE/mapping/${VENDOR_VER}.cil" /mnt/work/selinux_build/
          cp -f "$SYS_SE/mapping/${VENDOR_VER}.compat.cil" /mnt/work/selinux_build/ 2>/dev/null || true
          cp -f /mnt/work/mounts/sysext_ro/etc/selinux/system_ext_sepolicy.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp -f /mnt/work/mounts/sysext_ro/etc/selinux/mapping/${VENDOR_VER}.cil /mnt/work/selinux_build/system_ext_mapping.cil 2>/dev/null || true
          cp -f /mnt/work/mounts/prod_ro/etc/selinux/product_sepolicy.cil /mnt/work/selinux_build/ 2>/dev/null || true
          cp -f /mnt/work/mounts/prod_ro/etc/selinux/mapping/${VENDOR_VER}.cil /mnt/work/selinux_build/product_mapping.cil 2>/dev/null || true
          sudo cp -f /mnt/work/vendor_dir/etc/selinux/vendor_sepolicy.cil /mnt/work/selinux_build/
          sudo cp -f /mnt/work/vendor_dir/etc/selinux/plat_pub_versioned.cil /mnt/work/selinux_build/
          sudo chown -R $USER:$USER /mnt/work/selinux_build

          # Calcular hashes SHA-256 antes de filtrar CIL para que coincidan con las particiones montadas
          cat "$SYS_SE/plat_sepolicy.cil" "$SYS_SE/mapping/${VENDOR_VER}.cil" "$SYS_SE/mapping/${VENDOR_VER}.compat.cil" 2>/dev/null \
            | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/plat_and_mapping.sha256

          cat /mnt/work/mounts/sysext_ro/etc/selinux/system_ext_sepolicy.cil /mnt/work/mounts/sysext_ro/etc/selinux/mapping/${VENDOR_VER}.cil 2>/dev/null \
            | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/system_ext_and_mapping.sha256

          cat /mnt/work/mounts/prod_ro/etc/selinux/product_sepolicy.cil /mnt/work/mounts/prod_ro/etc/selinux/mapping/${VENDOR_VER}.cil 2>/dev/null \
            | sha256sum | awk '{print $1}' > /mnt/work/selinux_build/product_and_mapping.sha256

          sudo umount /mnt/work/mounts/sys_ro /mnt/work/mounts/sysext_ro /mnt/work/mounts/prod_ro

          # Deduplicar declaraciones (type ...) y (typeattribute ...)
          python3 - << 'EOF'
          import re
          seen_types, seen_attrs = set(), set()
          type_re = re.compile(r'^\s*\(type\s+([^\s\)]+)\s*\)\s*$')
          attr_re = re.compile(r'^\s*\(typeattribute\s+([^\s\)]+)\s*\)\s*$')
          files = [
              "/mnt/work/selinux_build/plat_sepolicy.cil",
              "/mnt/work/selinux_build/202604.cil",
              "/mnt/work/selinux_build/202604.compat.cil",
              "/mnt/work/selinux_build/system_ext_sepolicy.cil",
              "/mnt/work/selinux_build/system_ext_mapping.cil",
              "/mnt/work/selinux_build/product_sepolicy.cil",
              "/mnt/work/selinux_build/product_mapping.cil",
              "/mnt/work/selinux_build/plat_pub_versioned.cil",
              "/mnt/work/selinux_build/vendor_sepolicy.cil",
          ]
          for path in files:
              try:
                  with open(path, "r") as f:
                      lines = f.readlines()
              except FileNotFoundError:
                  continue
              out = []
              for line in lines:
                  m1 = type_re.match(line)
                  if m1:
                      if m1.group(1) in seen_types: continue
                      seen_types.add(m1.group(1))
                  m2 = attr_re.match(line)
                  if m2:
                      if m2.group(1) in seen_attrs: continue
                      seen_attrs.add(m2.group(1))
                  out.append(line)
              with open(path, "w") as f:
                  f.writelines(out)
          EOF

          CIL_LIST=""
          for f in plat_sepolicy.cil ${VENDOR_VER}.cil ${VENDOR_VER}.compat.cil system_ext_sepolicy.cil system_ext_mapping.cil product_sepolicy.cil product_mapping.cil plat_pub_versioned.cil vendor_sepolicy.cil; do
            [ -f "/mnt/work/selinux_build/$f" ] && CIL_LIST="$CIL_LIST /mnt/work/selinux_build/$f"
          done

          /usr/local/bin/secilc -m -M true -G -N -c 30 $CIL_LIST \
            -o /mnt/work/selinux_build/precompiled_sepolicy \
            -f /dev/null

          sudo cp -f /mnt/work/selinux_build/precompiled_sepolicy /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy
          sudo cp -f /mnt/work/selinux_build/plat_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.plat_sepolicy_and_mapping.sha256
          sudo cp -f /mnt/work/selinux_build/system_ext_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.system_ext_sepolicy_and_mapping.sha256
          sudo cp -f /mnt/work/selinux_build/product_and_mapping.sha256 /mnt/work/vendor_dir/etc/selinux/precompiled_sepolicy.product_sepolicy_and_mapping.sha256

          # 3. Limpiar AVB y cifrado forzado en fstab de vendor
          for FSTAB in /mnt/work/vendor_dir/etc/fstab.*; do
            [ -f "$FSTAB" ] || continue
            sudo sed -i 's/,avb=[^,]*//g; s/,avb//g; s/avb=[^,]*,//g' "$FSTAB"
            sudo sed -i 's/fileencryption=[^,]*,//g; s/,fileencryption=[^,]*//g' "$FSTAB"
          done

          # 4. Reempaquetar vendor.img en EROFS nativo (el formato original de vendor_evox.img)
          sudo mkfs.erofs -zlz4hc,9 \
            --file-contexts=/mnt/work/vendor_dir/etc/selinux/vendor_file_contexts \
            /mnt/work/images/vendor.img \
            /mnt/work/vendor_dir

      - name: Inyectar módulos en vendor_boot y reempaquetar
        run: |
          set -euo pipefail
          WORK_DIR=/mnt/work/vendor_boot_repack
          RAMDISK_ROOT="$WORK_DIR/ramdisk_root"
          VERIFY_DIR="$WORK_DIR/verify"
          mkdir -p "$RAMDISK_ROOT" "$VERIFY_DIR" /mnt/work/out
          cp -f /mnt/work/images/vendor_boot.img "$WORK_DIR/vendor_boot.img"
          cd "$WORK_DIR"

          set +e
          /mnt/work/magiskboot unpack vendor_boot.img
          unpack_status=$?
          set -e
          if [ "$unpack_status" -ne 0 ] && [ "$unpack_status" -ne 3 ]; then
            echo "::error::magiskboot no pudo desempacar vendor_boot.img (código $unpack_status)"
            exit 1
          fi
          test -f ramdisk.cpio || { echo "::error::magiskboot no generó ramdisk.cpio"; exit 1; }
          echo "magiskboot descomprime el ramdisk al desempacar y conserva su formato al reempaquetarlo."

          (cd "$RAMDISK_ROOT" && /mnt/work/magiskboot cpio "$WORK_DIR/ramdisk.cpio" extract)
          MODULES_ROOT="$RAMDISK_ROOT/lib/modules"
          test -d "$MODULES_ROOT" || { echo "::error::vendor_boot no contiene /lib/modules en el ramdisk"; exit 1; }
          mapfile -d '' RAMDISK_KOS < <(find "$MODULES_ROOT" -type f -name "*.ko" -print0)
          [ "${#RAMDISK_KOS[@]}" -gt 0 ] || { echo "::error::No hay módulos .ko en /lib/modules del ramdisk"; exit 1; }

          REPLACED=0
          for ramdisk_ko in "${RAMDISK_KOS[@]}"; do
            ko_name=$(basename "$ramdisk_ko")
            new_ko=$(find /mnt/work/ko_new -type f -name "$ko_name" -print -quit)
            if [ -z "$new_ko" ]; then
              echo "::warning::No hay versión compilada de $ko_name; se conserva el módulo del vendor_boot"
              continue
            fi
            ramdisk_entry=${ramdisk_ko#"$RAMDISK_ROOT"/}
            /mnt/work/magiskboot cpio "$WORK_DIR/ramdisk.cpio" "add 0644 $ramdisk_entry $new_ko"
            REPLACED=$((REPLACED + 1))
            echo "Módulo actualizado en vendor_boot: $ramdisk_entry"
          done
          [ "$REPLACED" -gt 0 ] || { echo "::error::Ningún módulo de vendor_boot coincidió con /mnt/work/ko_new"; exit 1; }

          /mnt/work/magiskboot repack vendor_boot.img /mnt/work/out/vendor_boot_hyperos.img
          test -s /mnt/work/out/vendor_boot_hyperos.img || { echo "::error::No se generó vendor_boot_hyperos.img"; exit 1; }

          mkdir -p "$VERIFY_DIR/ramdisk_root"
          cd "$VERIFY_DIR"
          set +e
          /mnt/work/magiskboot unpack /mnt/work/out/vendor_boot_hyperos.img
          verify_status=$?
          set -e
          if [ "$verify_status" -ne 0 ] && [ "$verify_status" -ne 3 ]; then
            echo "::error::No se pudo verificar vendor_boot_hyperos.img (código $verify_status)"
            exit 1
          fi
          test -f ramdisk.cpio || { echo "::error::El vendor_boot reempaquetado no contiene ramdisk.cpio"; exit 1; }
          (cd ramdisk_root && /mnt/work/magiskboot cpio ../ramdisk.cpio extract)
          for ramdisk_ko in "${RAMDISK_KOS[@]}"; do
            ko_name=$(basename "$ramdisk_ko")
            new_ko=$(find /mnt/work/ko_new -type f -name "$ko_name" -print -quit)
            [ -n "$new_ko" ] || continue
            ramdisk_entry=${ramdisk_ko#"$RAMDISK_ROOT"/}
            cmp -s "$new_ko" "$VERIFY_DIR/ramdisk_root/$ramdisk_entry" || {
              echo "::error::El módulo no quedó actualizado en el vendor_boot final: $ramdisk_entry"
              exit 1
            }
          done
          ls -lh /mnt/work/out/vendor_boot_hyperos.img

      - name: Empaquetar super_hyperos.img con lpmake (7583301632 bytes exactos de rhode)
        run: |
          cd /mnt/work/images

          SIZE_SYS=$(stat -c%s system.img)
          SIZE_SYSEXT=$(stat -c%s system_ext.img)
          SIZE_PROD=$(stat -c%s product.img)
          SIZE_VEND=$(stat -c%s vendor.img)

          TOTAL_PARTS=$((SIZE_SYS + SIZE_SYSEXT + SIZE_PROD + SIZE_VEND))
          SUPER_DEVICE_SIZE=7583301632
          SUPER_GROUP_SIZE=7579107328

          echo "=== Desglose final de particiones ==="
          echo "system:     $SIZE_SYS bytes ($((SIZE_SYS / 1024 / 1024)) MB)"
          echo "system_ext: $SIZE_SYSEXT bytes ($((SIZE_SYSEXT / 1024 / 1024)) MB)"
          echo "product:    $SIZE_PROD bytes ($((SIZE_PROD / 1024 / 1024)) MB)"
          echo "vendor:     $SIZE_VEND bytes ($((SIZE_VEND / 1024 / 1024)) MB)"
          echo "TOTAL:      $TOTAL_PARTS bytes / $SUPER_GROUP_SIZE bytes máximos"

          if [ "$TOTAL_PARTS" -gt "$SUPER_GROUP_SIZE" ]; then
            echo "ERROR: La suma ($TOTAL_PARTS) excede el límite físico de super en rhode ($SUPER_GROUP_SIZE)."
            exit 1
          fi

          lpmake \
            --metadata-size 65536 \
            --super-name super \
            --metadata-slots 3 \
            --device super:${SUPER_DEVICE_SIZE} \
            --group qti_dynamic_partitions_a:${SUPER_GROUP_SIZE} \
            --group qti_dynamic_partitions_b:${SUPER_GROUP_SIZE} \
            --partition system_a:readonly:${SIZE_SYS}:qti_dynamic_partitions_a --image system_a=system.img \
            --partition system_ext_a:readonly:${SIZE_SYSEXT}:qti_dynamic_partitions_a --image system_ext_a=system_ext.img \
            --partition product_a:readonly:${SIZE_PROD}:qti_dynamic_partitions_a --image product_a=product.img \
            --partition vendor_a:readonly:${SIZE_VEND}:qti_dynamic_partitions_a --image vendor_a=vendor.img \
            --partition system_b:readonly:0:qti_dynamic_partitions_b \
            --partition system_ext_b:readonly:0:qti_dynamic_partitions_b \
            --partition product_b:readonly:0:qti_dynamic_partitions_b \
            --partition vendor_b:readonly:0:qti_dynamic_partitions_b \
            --sparse \
            --output /mnt/work/out/super_hyperos.img

          ls -lh /mnt/work/out/super_hyperos.img
          zstd -T0 -10 /mnt/work/out/super_hyperos.img -o /mnt/work/out/super_hyperos.img.zst
          rm -f /mnt/work/out/super_hyperos.img
          split -b 1900M -d /mnt/work/out/super_hyperos.img.zst /mnt/work/out/super_hyperos.img.zst.part_
          rm -f /mnt/work/out/super_hyperos.img.zst
          ls -lh /mnt/work/out/

      - name: Publicar super_hyperos.img.zst y boot_hyperos_bpf.img en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hyperos4-rhode-alpha2
          name: "HyperOS 4 Port (rhode) - Alpha 2 (super 7583301632 + boot BPF + SELinux SHA256 + módulos .ko)"
          files: |
            /mnt/work/out/*
